# Справочник способов реализации (СП1-СП9, Методика ФСТЭК)
# Файл сгенерирован scripts/import_sources.py — не редактировать вручную.

methods:
  СП1:
    code: СП1
    name: использование уязвимостей (уязвимостей кода (программного обеспечения), уязвимостей архитектуры и конфигурации систем
      и сетей, а также организационных и многофакторных уязвимостей)
  СП2:
    code: СП2
    name: внедрение вредоносного программного обеспечения
  СП3:
    code: СП3
    name: использование недекларированных возможностей программного обеспечения и (или) программно-аппаратных средств
  СП4:
    code: СП4
    name: установка программных и (или) программно-аппаратных закладок в программное обеспечение и (или) программно-аппаратные
      средства
  СП5:
    code: СП5
    name: формирование и использование скрытых каналов (по времени, по памяти) для передачи конфиденциальных данных
  СП6:
    code: СП6
    name: перехват (измерение) побочных электромагнитных излучений и наводок (других физических полей) для доступа к конфиденциальной
      информации, содержащейся в аппаратных средствах аутентификации
  СП7:
    code: СП7
    name: инвазивные способы доступа к конфиденциальной информации, содержащейся в аппаратных средствах аутентификации
  СП8:
    code: СП8
    name: нарушение безопасности при поставках программных, программно аппаратных средств и (или) услуг по установке, настройке,
      испытаниям, пусконаладочным работам (в том числе администрированию, обслуживанию)
  СП9:
    code: СП9
    name: ошибочные действия в ходе создания и эксплуатации систем и сетей, в том числе при установке, настройке программных
      и программно-аппаратных средств
