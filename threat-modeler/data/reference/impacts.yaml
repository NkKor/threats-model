# Справочник видов воздействия (В1-В7, Методика ФСТЭК)
# Файл сгенерирован scripts/import_sources.py — не редактировать вручную.

impacts:
  В1:
    code: В1
    name: утечка (перехват) конфиденциальной информации, информации ограниченного доступа или отдельных данных
  В2:
    code: В2
    name: несанкционированный доступ к компонентам, защищаемой информации, системным, конфигурационным, иным служебным данным
  В3:
    code: В3
    name: отказ в обслуживании компонентов (нарушение доступности)
  В4:
    code: В4
    name: несанкционированная модификация, подмена, искажение защищаемой информации, системных, конфигурационных, иных служебных
      данных (нарушение целостности)
  В5:
    code: В5
    name: несанкционированное использование вычислительных ресурсов систем и сетей в интересах решения несвойственных им задач
  В6:
    code: В6
    name: нарушение функционирования (работоспособности) программно-аппаратных средств обработки, передачи и хранения информации
  В7:
    code: В7
    name: кража/утрата носителя информации
