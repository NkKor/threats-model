# Типы информационных систем
# Файл сгенерирован scripts/import_sources.py — не редактировать вручную.

system_types:
  АСУ ТП:
    code: АСУ ТП
    name: АСУ ТП
    description: комплекс программных и аппаратных средств, автоматизирующих управление проомышленным оборудованием и технологическими
      процессами
  КИИ:
    code: КИИ
    name: КИИ
    description: 'критическая информационная инфраструктура, объединяющая ИТ и АСУ ТП системы из ключевых отраслей, нарушение
      работы которых угрожает безопасности государства (сферы КИИ: здравоохранение, наука, транспорт, связь, энергетика, финансовый
      сектор, топливно-энергетический комплекс, атомная энергия, оборонная промышленность (ОПК), ракетно-космическая отрасль,
      горнодобывающая промышленность, металлургическая промышленность, химическая промышленность, госсектор, жкх, водоснабжение)'
  ГИС:
    code: ГИС
    name: ГИС
    description: государственная информационная система (специализированная цифровая инфрастуктура, создаваемая госорганами
      для автоматизации работы, хранения данных и предоставления государственных услуг гражданам и бизнесу)
  ПДн:
    code: ПДн
    name: ПДн
    description: персональные данные (любая информация, позволяющая прямо или косвенно определить физическое лицо)
  ИСПДн:
    code: ИСПДн
    name: ИСПДн
    description: информационная система персональных данных (совокупность баз данных ,содержащих персональную информацию о
      людях, а также информационных технология и технических средствЮ которые используются для обработки этих данных
  КТ:
    code: КТ
    name: КТ
    description: коммерческая тайна (специальный режим конфиденциальности,Ю который позволяет бизнесу защитить ценную информацию
      и сохранить или увеличить свои доходы)
  ДСП:
    code: ДСП
    name: ДСП
    description: для служебного пользования (несекретная пометка, которая присваевается официальным документами, содержащим
      конфиденциальную служебную информацию)
  веб-портал:
    code: веб-портал
    name: веб-портал
    description: веб-сайт, социальная сеть, социальные платформы
  КОРП ИС:
    code: КОРП ИС
    name: КОРП ИС
    description: корпоративные информационные системы (комплекс ПО, баз данных и продуктов, объединяющий бизнес-процессы компании
      в единую систему)
  портал госуслуг (ЕПГУ, РПГУ):
    code: портал госуслуг (ЕПГУ, РПГУ)
    name: портал госуслуг (ЕПГУ, РПГУ)
    description: единый портал государственных и муниципальных услуг, являющийся ГИС
  ГИС МИД:
    code: ГИС МИД
    name: ГИС МИД
    description: цифровой комплекс, созданный для автоматихации работы Министерства иностранных дел
  ГИС МЧС:
    code: ГИС МЧС
    name: ГИС МЧС
    description: единая государственная система предупреждения и ликвидации чрезвычайных ситуаций и иные ГИС, принадлежащие
      МЧС
  ИС обороны и безопасности:
    code: ИС обороны и безопасности
    name: ИС обороны и безопасности
    description: информационные системы, применяемые государственными структурами, правоохранительными органами и военными
      ведомствами для автоматизации управления, сбора данных, координации действия и защиты суверенитета
  ГИС избирательных комиссий:
    code: ГИС избирательных комиссий
    name: ГИС избирательных комиссий
    description: специализированные платформы, предназначенные для автоматизации всех этапов избирательного процесса от учета
      избирателей до подсчета голосов (гапример, ГАС Выборы)
