# Виды нарушителей и уровни возможностей Н1-Н4
# Файл сгенерирован scripts/import_sources.py — не редактировать вручную.

violator_types:
  specialnye_sluzhby_inostrannyh_gosudarstv:
    code: specialnye_sluzhby_inostrannyh_gosudarstv
    name: Специальные службы иностранных государств
    category: external
    level: Н4
    goals: В связи с особенностями целей и задач, решаемых Системой, а также обрабатываемой информацией, Система не представляет
      интереса для специальных служб иностранных государств.
  terroristicheskie_ekstremistskie_gruppirovki:
    code: terroristicheskie_ekstremistskie_gruppirovki
    name: Террористические, экстремистские группировки
    category: external
    level: Н3
    goals: В связи с особенностями целей и задач, решаемых Системой, а также обрабатываемой информацией, Система не представляет
      интереса для террористических, экстремистских группировок.
  prestupnye_gruppy_kriminalnye_struktury:
    code: prestupnye_gruppy_kriminalnye_struktury
    name: Преступные группы (криминальные структуры)
    category: external
    level: Н2
    goals: Получение финансовой или иной материальной выгоды. Желание самореализации (подтверждение статуса)
  otdelnye_fizicheskie_lica_hakery:
    code: otdelnye_fizicheskie_lica_hakery
    name: Отдельные физические лица (хакеры)
    category: external
    level: Н1
    goals: Получение финансовой или иной материальной выгоды. Любопытство или желание самореализации (подтверждение статуса).
  byvshie_uvolennye_rabotniki_polzovateli:
    code: byvshie_uvolennye_rabotniki_polzovateli
    name: Бывшие (уволенные) работники (пользователи)
    category: external
    level: Н1
    goals: Получение финансовой или иной материальной выгоды. Месть за ранее совершенные действия
  konkuriruyuschie_organizacii:
    code: konkuriruyuschie_organizacii
    name: Конкурирующие организации
    category: external
    level: Н2
    goals: Получение конкурентных преимуществ. Получение финансовой или иной материальной выгоды.
  razrabotchiki_programmnyh_programmno_apparatnyh_:
    code: razrabotchiki_programmnyh_programmno_apparatnyh_
    name: Разработчики программных, программно-аппаратных средств
    category: internal
    level: Н3
    goals: Данные лица не обладают доступом к защищаемой информации, не участвуют в её обработке, не имеют мотивации к нарушению
      безопасности и действуют в рамках строго регламентированных процедур, контролируемых ООО «Юнитех»
  lica_obespechivayuschie_postavku_programmnyh_pro:
    code: lica_obespechivayuschie_postavku_programmnyh_pro
    name: Лица, обеспечивающие поставку программных, программно-аппаратных средств, обеспечивающих систем
    category: external
    level: Н1
    goals: Получение финансовой или иной материальной выгоды. Непреднамеренные, неосторожные или неквалифицированные действия.
      Получение конкурентных преимуществ.
  lica_privlekaemye_dlya_ustanovki_nastroyki_ispyt:
    code: lica_privlekaemye_dlya_ustanovki_nastroyki_ispyt
    name: Лица, привлекаемые для установки, настройки, испытаний, пусконаладочных и иных видов работ
    category: internal
    level: Н2
    goals: Данные лица не обладают доступом к защищаемой информации, не участвуют в её обработке, не имеют мотивации к нарушению
      безопасности и действуют в рамках строго регламентированных процедур, контролируемых ООО «Юнитех»
  postavschiki_uslug_svyazi:
    code: postavschiki_uslug_svyazi
    name: Поставщики услуг связи
    category: internal
    level: Н2
    goals: Получение финансовой или иной материальной выгоды. Непреднамеренные, неосторожные или неквалифицированные действия.
      Получение конкурентных преимуществ.
  lica_obespechivayuschie_funkcionirovanie_sistem_:
    code: lica_obespechivayuschie_funkcionirovanie_sistem_
    name: Лица, обеспечивающие функционирование систем и сетей или обеспечивающих систем оператора (администрация, охрана,
      уборщики и др.)
    category: internal
    level: Н1
    goals: Получение финансовой или иной материальной выгоды. Непреднамеренные, неосторожные или неквалифицированные действия
  avtorizovannye_polzovateli_sistem_i_setey:
    code: avtorizovannye_polzovateli_sistem_i_setey
    name: Авторизованные пользователи систем и сетей
    category: internal
    level: Н1
    goals: Получение финансовой или иной материальной выгоды. Любопытство или желание самореализации (подтверждение статуса).
      Месть за ранее совершенные действия. Непреднамеренные, неосторожные или неквалифицированные действия
  sistemnye_administratory_i_administratory_bezopa:
    code: sistemnye_administratory_i_administratory_bezopa
    name: Системные администраторы и администраторы безопасности
    category: internal
    level: Н2
    goals: Получение финансовой или иной материальной выгоды. Любопытство или желание самореализации (подтверждение статуса).
      Месть за ранее совершенные действия. Непреднамеренные, неосторожные или неквалифицированные действия
violator_levels:
  Н1:
    code: Н1
    rank: 1
    name: Нарушитель, обладающий базовыми возможностями
    description: Имеет возможность при реализации угроз безопасности информации использовать только известные уязвимости,
      скрипты и инструменты. Имеет возможность использовать средства реализации угроз (инструменты), свободно распространяемые
      в сети «Интернет» и разработанные другими лицами, имеет минимальные знания механизмов их функционирования, доставки
      и выполнения вредоносного программного обеспечения, эксплойтов. Обладает базовыми компьютерными знаниями и навыками
      на уровне пользователя. Имеет возможность реализации угроз за счет физических воздействий на технические средства обработки
      и хранения информации, линий связи и обеспечивающие системы систем и сетей при наличии физического доступа к ним. Таким
      образом, нарушители с базовыми возможностями имеют возможность реализовывать только известные угрозы, направленные на
      известные (документированные) уязвимости, с использованием общедоступных инструментов
    violators: Физическое лицо (хакер) Лица, обеспечивающие поставку программных, программно-аппаратных средств, обеспечивающих
      систем Лица, обеспечивающие функционирование систем и сетей или обеспечивающих систем (администрация, охрана, уборщики
      и т.д.) Авторизованные пользователи систем и сетей Бывшие работники (пользователи)
    potential: Низкий
    methods_extended:
    - code: СП.1
      name: Эксплуатация уязвимостей
    - code: СП.2
      name: Использование недостатков конфигурации
    - code: СП.3
      name: Использование недостатков архитектуры
    - code: СП.4
      name: Внедрение вредоносного программного обеспечения
    - code: СП.7
      name: Прослушивание (захват) сетевого трафика
    - code: СП.8
      name: Сканирование сетевой инфраструктуры
    - code: СП.9
      name: Изучение информации о системе
    - code: СП.10
      name: Атака типа "человек посередине"
    - code: СП.12
      name: Считывание вводимой и выводимой информации
    - code: СП.13
      name: Реализация социальной инженерии
    - code: СП.14
      name: Атака типа "отказ в обслуживании"
    - code: СП.18
      name: Использование недостатков механизмов разграничения доступа
    - code: СП.20
      name: Автоматический сбор человеко-читаемых данных
    - code: СП.24
      name: Физическое воздействие
    - code: СП.25
      name: Атаки на системы с распределенным реестром
    - code: СП.26
      name: Воздействие через системы хранения и резервирования данных
    level_violators:
    - otdelnye_fizicheskie_lica_hakery
    - byvshie_uvolennye_rabotniki_polzovateli
    - lica_obespechivayuschie_postavku_programmnyh_pro
    - lica_obespechivayuschie_funkcionirovanie_sistem_
    - avtorizovannye_polzovateli_sistem_i_setey
  Н2:
    code: Н2
    rank: 2
    name: Нарушитель, обладающий базовыми повышенными возможностями
    description: Обладает всеми возможностями нарушителей с базовыми возможностями. Имеет возможность использовать средства
      реализации угроз (инструменты), свободно распространяемые в сети «Интернет» и разработанные другими лицами, однако хорошо
      владеет этими
    violators: Преступные группы (два лица и более, действующие по единому плану) Конкурирующие организации Поставщики вычислительных
      услуг,
    potential: Средний
    methods_extended:
    - code: СП.1
      name: Эксплуатация уязвимостей
    - code: СП.2
      name: Использование недостатков конфигурации
    - code: СП.4
      name: Внедрение вредоносного программного обеспечения
    - code: СП.5
      name: Внедрение программных и аппаратных закладок
    - code: СП.7
      name: Прослушивание (захват) сетевого трафика
    - code: СП.9
      name: Изучение информации о системе
    - code: СП.10
      name: Атака типа "человек посередине"
    - code: СП.12
      name: Считывание вводимой и выводимой информации
    - code: СП.13
      name: Реализация социальной инженерии
    - code: СП.14
      name: Атака типа "отказ в обслуживании"
    - code: СП.15
      name: Шифрование данных
    - code: СП.17
      name: Подбор (восстановление) аутентификационной информации
    - code: СП.18
      name: Использование недостатков механизмов разграничения доступа
    - code: СП.19
      name: Модификация ОС (подмена системных файлов, внедрение вредоносного кода в системные процессы и ядро ОС)
    - code: СП.21
      name: Повреждение данных
    - code: СП.22
      name: Атака на Веб-приложение
    - code: СП.26
      name: Воздействие через системы хранения и резервирования данных
    level_violators:
    - prestupnye_gruppy_kriminalnye_struktury
    - konkuriruyuschie_organizacii
    - lica_privlekaemye_dlya_ustanovki_nastroyki_ispyt
    - postavschiki_uslug_svyazi
    - sistemnye_administratory_i_administratory_bezopa
  Н3:
    code: Н3
    rank: 3
    name: Нарушитель, обладающий средними возможностями
    description: Обладает всеми возможностями нарушителей с базовыми повышенными возможностями. Имеет возможность приобретать
      информацию об уязвимостях, размещаемую на специализированных платных ресурсах (биржах уязвимостей). Имеет возможность
      приобретать дорогостоящие средства и инструменты для реализации угроз, размещаемые на специализированных платных ресурсах
      (биржах уязвимостей). Имеет возможность самостоятельно разрабатывать средства
    violators: Террористические, экстремистские группировки Разработчики программных, программно-аппаратных средств
    potential: Средний
    methods_extended:
    - code: СП.2
      name: Использование недостатков конфигурации
    - code: СП.4
      name: Внедрение вредоносного программного обеспечения
    - code: СП.5
      name: Внедрение программных и аппаратных закладок
    - code: СП.7
      name: Прослушивание (захват) сетевого трафика
    - code: СП.11
      name: Применение скрытых каналов
    - code: СП.16
      name: Нарушение изоляции
    - code: СП.19
      name: Модификация ОС (подмена системных файлов, внедрение вредоносного кода в системные процессы и ядро ОС)
    - code: СП.23
      name: Модификация (подмена) прошивки (микропрограммы)
    - code: СП.26
      name: Воздействие через системы хранения и резервирования данных
    level_violators:
    - terroristicheskie_ekstremistskie_gruppirovki
    - razrabotchiki_programmnyh_programmno_apparatnyh_
  Н4:
    code: Н4
    rank: 4
    name: Нарушитель, обладающий высокими возможностями
    description: Обладает всеми возможностями нарушителей со средними возможностями. Имеет возможность получения доступа к
      исходному коду встраиваемого программного обеспечения аппаратных платформ, системного и прикладного программного обеспечения,
      телекоммуникационного оборудования и других программно-аппаратных средств для получения сведений об уязвимостях «нулевого
      дня». Имеет возможность внедрения программных (программно- аппаратных) закладок или уязвимостей на различных этапах
      поставки программного обеспечения или программно-аппаратных средств.
    violators: Специальные службы иностранных государств
    potential: Высокий
    methods_extended:
    - code: СП.6
      name: Использование недекларированных возможностей
    level_violators:
    - specialnye_sluzhby_inostrannyh_gosudarstv
