violator_levels:
  Н1:
    code: Н1
    rank: 1
    name: Нарушитель, обладающий базовыми возможностями
    description: Имеет возможность при реализации угроз безопасности информации использовать только известные уязвимости,
      скрипты и инструменты. Имеет возможность использовать средства реализации угроз (инструменты), свободно распространяемые
      в сети «Интернет» и разработанные другими лицами, имеет минимальные знания механизмов их функционирования, доставки
      и выполнения вредоносного программного обеспечения, эксплойтов. Обладает базовыми компьютерными знаниями и навыками
      на уровне пользователя. Имеет возможность реализации угроз за счет физических воздействий на технические средства обработки
      и хранения информации, линий связи и обеспечивающие системы систем и сетей при наличии физического доступа к ним. Таким
      образом, нарушители с базовыми возможностями имеют возможность реализовывать только известные угрозы, направленные на
      известные (документированные) уязвимости, с использованием общедоступных инструментов
    violators: Физическое лицо (хакер) Лица, обеспечивающие поставку программных, программно-аппаратных средств, обеспечивающих
      систем Лица, обеспечивающие функционирование систем и сетей или обеспечивающих систем (администрация, охрана, уборщики
      и т.д.) Авторизованные пользователи систем и сетей Бывшие работники (пользователи)
    methods:
    - СП1
    - СП2
    - СП3
    - СП4
    - СП5
    - СП6
    - СП7
    - СП8
    - СП9
    level_violators:
    - otdelnye_fizicheskie_lica_hakery
    - byvshie_uvolennye_rabotniki_polzovateli
    - lica_obespechivayuschie_postavku_programmnyh_pro
    - lica_obespechivayuschie_funkcionirovanie_sistem_
    - avtorizovannye_polzovateli_sistem_i_setey
  Н2:
    code: Н2
    rank: 2
    name: Нарушитель, обладающий базовыми повышенными возможностями
    description: Обладает всеми возможностями нарушителей с базовыми возможностями. Имеет возможность использовать средства
      реализации угроз (инструменты), свободно распространяемые в сети «Интернет» и разработанные другими лицами, однако хорошо
      владеет этими
    violators: Преступные группы (два лица и более, действующие по единому плану) Конкурирующие организации Поставщики вычислительных
      услуг,
    methods:
    - СП1
    - СП2
    - СП3
    - СП4
    - СП5
    - СП6
    - СП7
    - СП8
    - СП9
    level_violators:
    - prestupnye_gruppy_kriminalnye_struktury
    - konkuriruyuschie_organizacii
    - lica_privlekaemye_dlya_ustanovki_nastroyki_ispyt
    - postavschiki_uslug_svyazi
    - sistemnye_administratory_i_administratory_bezopa
  Н3:
    code: Н3
    rank: 3
    name: Нарушитель, обладающий средними возможностями
    description: Обладает всеми возможностями нарушителей с базовыми повышенными возможностями. Имеет возможность приобретать
      информацию об уязвимостях, размещаемую на специализированных платных ресурсах (биржах уязвимостей). Имеет возможность
      приобретать дорогостоящие средства и инструменты для реализации угроз, размещаемые на специализированных платных ресурсах
      (биржах уязвимостей). Имеет возможность самостоятельно разрабатывать средства
    violators: Террористические, экстремистские группировки Разработчики программных, программно-аппаратных средств
    methods:
    - СП1
    - СП2
    - СП3
    - СП4
    - СП5
    - СП6
    - СП7
    - СП8
    - СП9
    level_violators:
    - terroristicheskie_ekstremistskie_gruppirovki
    - razrabotchiki_programmnyh_programmno_apparatnyh_
  Н4:
    code: Н4
    rank: 4
    name: Нарушитель, обладающий высокими возможностями
    description: Обладает всеми возможностями нарушителей со средними возможностями. Имеет возможность получения доступа к
      исходному коду встраиваемого программного обеспечения аппаратных платформ, системного и прикладного программного обеспечения,
      телекоммуникационного оборудования и других программно-аппаратных средств для получения сведений об уязвимостях «нулевого
      дня». Имеет возможность внедрения программных (программно- аппаратных) закладок или уязвимостей на различных этапах
      поставки программного обеспечения или программно-аппаратных средств.
    violators: Специальные службы иностранных государств
    methods:
    - СП1
    - СП2
    - СП3
    - СП4
    - СП5
    - СП6
    - СП7
    - СП8
    - СП9
    level_violators:
    - specialnye_sluzhby_inostrannyh_gosudarstv
