# Правила составления таблиц отчета
# Согласно методике ФСТЭК

report_tables:
  table1:
    name: "Перечень возможных (вероятных) УБИ для Системы"
    description: "Содержит все угрозы безопасности информации, которые могут быть реализованы в системе с учетом её характеристик"
    generation_rules:
      - "Включаются все угрозы из базового перечня (УБИ.001-УБИ.250)"
      - "Исключаются угрозы, для которых отсутствуют необходимые технологии (флаги исключений)"
      - "Учитываются выбранные объекты воздействия"
      - "Учитываются уровни нарушителей (внутренних и внешних)"
      - "Учитываются выбранные интерфейсы доступа"
    columns:
      - "Идентификатор УБИ"
      - "Наименование угрозы"
      - "Уровень нарушителя (внутренний)"
      - "Уровень нарушителя (внешний)"
      - "Объект воздействия"
      - "Способы реализации"
      - "Негативные последствия"
      - "Тактика"
      - "Техника"
      - "Примечания"
      
  table2:
    name: "Перечень актуальных УБИ для Системы"
    description: "Содержит угрозы, которые являются наиболее вероятными и значимыми для конкретной системы"
    generation_rules:
      - "Выбираются угрозы из Таблицы 1"
      - "Применяется дополнительная фильтрация по вероятности реализации"
      - "Учитывается критичность объектов воздействия"
      - "Учитывается наличие средств защиты"
      - "Может включать экспертные оценки"
    columns:
      - "Идентификатор УБИ"
      - "Наименование угрозы"
      - "Вероятность реализации (высокая/средняя/низкая)"
      - "Критичность последствий"
      - "Рекомендуемые меры защиты"
      - "Срок реализации мер"
      
  table3:
    name: "Актуальные угрозы для СКЗИ"
    description: "Специализированная таблица угроз для средств криптографической защиты информации"
    generation_rules:
      - "Выбираются угрозы, связанные с объектами О7 (Криптографические средства) и О8"
      - "Учитываются специфические методы реализации (СП1, СП2, СП9)"
      - "Включаются угрозы нарушения конфиденциальности ключей"
      - "Учитываются требования стандартов криптографической защиты"
    columns:
      - "Идентификатор УБИ"
      - "Наименование угрозы"
      - "Объект воздействия (СКЗИ)"
      - "Метод реализации"
      - "Негативные последствия"
      - "Требования стандартов"
      - "Меры противодействия"

generation_steps:
  step1:
    name: "Сбор исходных данных"
    actions:
      - "Заполнение характеристик системы (шаг 1 wizard)"
      - "Определение нарушителей (шаг 2 wizard)"
      - "Выбор интерфейсов (шаг 3 wizard)"
      - "Выбор объектов воздействия (шаг 4 wizard)"
      
  step2:
    name: "Применение правил корреляции"
    actions:
      - "Загрузка правил из correlation.yaml"
      - "Проверка соответствия уровней нарушителей"
      - "Проверка доступности объектов"
      - "Проверка доступности методов через интерфейсы"
      - "Применение флагов исключений"
      
  step3:
    name: "Формирование таблиц"
    actions:
      - "Генерация Таблицы 1 (возможные УБИ)"
      - "Фильтрация для Таблицы 2 (актуальные УБИ)"
      - "Специализированный отбор для Таблицы 3 (СКЗИ)"
      - "Форматирование данных для экспорта"
      
  step4:
    name: "Экспорт и представление"
    actions:
      - "Генерация Excel-отчета"
      - "Формирование сводной информации"
      - "Создание рекомендаций по защите"

validation_rules:
  - "Если система обрабатывает ПДн, должен быть указан уровень защищённости ПДн"
  - "Уровни нарушителей должны соответствовать кодам Н1-Н4"
  - "Выбранные объекты должны существовать в справочнике"
  - "Интерфейсы должны быть совместимы с выбранными технологиями"